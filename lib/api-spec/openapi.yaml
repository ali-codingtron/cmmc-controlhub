            - enrolledCount
            - notEnrolledCount
        privilegedWithoutMfa:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              email:
                type: string
              role:
                type: string
            required: [id, name, email, role]
        lockedAccounts:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              email:
                type: string
              role:
                type: string
              lockedUntil:
                type: string
                format: date-time
                nullable: true
              failedLoginCount:
                type: integer
