                $ref: "#/components/schemas/DocCheckResult"

  # ─── COMPLIANCE FRAMEWORKS ───────────────────────────────────
  /frameworks:
    get:
      operationId: listFrameworks
      tags: [frameworks]
      summary: List all active compliance frameworks
      responses:
        "200":
          description: List of compliance frameworks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ComplianceFramework"

  /packages:
    get:
      operationId: listPackages
      tags: [frameworks]
      summary: List all active compliance packages (optionally filtered by frameworkId)
      parameters:
        - name: frameworkId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of compliance packages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompliancePackageWithFramework"

  /organizations/{id}/packages:
    get:
      operationId: listOrgPackages
      tags: [frameworks]
      summary: List compliance packages assigned to an organization
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Organization package assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrgPackageAssignment"
    post:
      operationId: addOrgPackages
      tags: [frameworks]
      summary: Assign compliance packages to an organization
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddOrgPackagesBody"
      responses:
        "201":
          description: Packages assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddOrgPackagesResponse"

  /organizations/{id}/packages/{packageId}:
    delete:
      operationId: removeOrgPackage
      tags: [frameworks]
      summary: Remove (deactivate) a compliance package from an organization
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: packageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Package deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    # ─── AUTH ─────────────────────────────────────────────────
    LoginBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
        mfa_required:
          type: boolean
        mfa_setup_required:
          type: boolean
        mfa_state_token:
          type: string
      required:
        - user
        - token

    MfaSetupStartResponse:
      type: object
      properties:
        otpAuthUri:
          type: string
        manualKey:
          type: string
      required:
        - otpAuthUri
        - manualKey

    MfaSetupVerifyResponse:
      type: object
      properties:
        recoveryCodes:
          type: array
          items:
            type: string
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required:
        - recoveryCodes
        - token
        - user

    MfaCodeBody:
      type: object
      properties:
        code:
          type: string
      required:
        - code

    MfaRecoveryCodeBody:
      type: object
      properties:
        code:
          type: string
      required:
        - code

    MfaAdminActionBody:
      type: object
      properties:
        userId:
          type: string
      required:
        - userId

    MfaDisableBody:
      type: object
      properties:
        userId:
          type: string
        password:
          type: string
        code:
          type: string

    MfaRequireUserBody:
      type: object
      properties:
        userId:
          type: string
        mfaRequired:
          type: boolean
      required:
        - userId

    SecuritySettings:
      type: object
      properties:
        id:
          type: string
        mfaEnforcementMode:
          type: string
          enum: [disabled, admins_only, privileged, all_users]
        maxFailedLoginAttempts:
          type: integer
        lockoutDurationMinutes:
          type: integer
        updatedAt:
          type: string
          format: date-time
      required:
