openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: CMMC Compliance Operations Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: users
    description: User management
  - name: domains
    description: CMMC Security Domains
  - name: controls
    description: CMMC Controls
  - name: evidence
    description: Evidence Repository
  - name: tasks
    description: Compliance Tasks
  - name: poams
    description: Plan of Action and Milestones
  - name: dashboard
    description: Dashboard and Readiness Metrics
  - name: assessor
    description: Assessor-facing views and exports
  - name: audit
    description: Audit Trail
  - name: documents
    description: Documentation Automation - Policies, Procedures, Logs, Registers
  - name: document-templates
    description: Document Templates
  - name: document-logs
    description: Generated Compliance Logs
  - name: checklists
    description: Compliance Checklists
  - name: automation
    description: Documentation Automation Rules
  - name: frameworks
    description: Compliance Frameworks and Packages
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── AUTH ───────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out and clear session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/mfa/setup/start:
    post:
      operationId: mfaSetupStart
      tags: [auth]
      summary: Start TOTP MFA setup — returns otpauth URI and manual key
      responses:
        "200":
          description: OTP auth URI and manual key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaSetupStartResponse"

  /auth/mfa/setup/verify:
    post:
      operationId: mfaSetupVerify
      tags: [auth]
      summary: Verify first TOTP code and complete MFA enrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaCodeBody"
      responses:
        "200":
          description: Recovery codes + session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaSetupVerifyResponse"

  /auth/mfa/verify:
    post:
      operationId: mfaVerify
      tags: [auth]
      summary: Verify TOTP code during login challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaCodeBody"
      responses:
        "200":
          description: Full session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/mfa/recovery-code:
    post:
      operationId: mfaRecoveryCode
      tags: [auth]
      summary: Use a recovery code in place of TOTP during login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaRecoveryCodeBody"
      responses:
        "200":
          description: Full session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/mfa/reset:
    post:
      operationId: mfaReset
      tags: [auth]
      summary: Admin — reset a user's MFA enrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaAdminActionBody"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/mfa/disable:
    post:
      operationId: mfaDisable
      tags: [auth]
      summary: Disable MFA for a user (admin or self with password+code)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaDisableBody"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/mfa/require-user:
    patch:
      operationId: mfaRequireUser
      tags: [auth]
      summary: Admin — require MFA for a specific user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaRequireUserBody"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/unlock-user:
    post:
      operationId: unlockUser
      tags: [auth]
      summary: Admin — unlock a locked user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaAdminActionBody"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/security-settings:
    get:
      operationId: getSecuritySettings
      tags: [auth]
      summary: Admin — get global security settings
      responses:
        "200":
          description: Security settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecuritySettings"
    patch:
      operationId: updateSecuritySettings
      tags: [auth]
      summary: Admin — update global security settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSecuritySettingsBody"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecuritySettings"

  /auth/security-center:
    get:
      operationId: getSecurityCenter
      tags: [auth]
      summary: Admin — get MFA adoption stats and recent security events
      responses:
        "200":
          description: Security center data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityCenterData"

  # ─── USERS ──────────────────────────────────────────────────
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserBody"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Permanently delete a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted

  /users/{id}/deactivate:
    post:
      operationId: deactivateUser
      tags: [users]
      summary: Deactivate a user account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deactivated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}/activate:
    post:
      operationId: activateUser
      tags: [users]
      summary: Reactivate a user account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Activated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}/reset-password:
    post:
      operationId: resetUserPassword
      tags: [users]
      summary: Reset a user password
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordBody"
      responses:
        "200":
          description: Password reset

  /users/{id}/orgs:
    get:
      operationId: getUserOrgs
      tags: [users]
      summary: List organization memberships for a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of org memberships
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserOrgMembership"
    post:
      operationId: addUserToOrg
      tags: [users]
      summary: Add a user to an organization
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddUserToOrgBody"
      responses:
        "200":
          description: Membership created or updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserOrgMembership"

  /users/{id}/orgs/{orgId}:
    patch:
      operationId: updateUserOrgMembership
      tags: [users]
      summary: Update a user's role in an organization
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: orgId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserOrgMembershipBody"
      responses:
        "200":
          description: Updated membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserOrgMembership"
    delete:
      operationId: removeUserFromOrg
      tags: [users]
      summary: Remove a user from an organization
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: orgId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed

  # ─── INVITATIONS ────────────────────────────────────────────
  /users/invite:
    post:
      operationId: sendInvitation
      tags: [users]
      summary: Invite a new user by email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendInvitationBody"
      responses:
        "201":
          description: Invitation sent (or inviteUrl returned if email not configured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendInvitationResponse"

  /users/{id}/resend-invite:
    post:
      operationId: resendInvitation
      tags: [users]
      summary: Resend an invitation to an invited user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendInviteBody"
      responses:
        "200":
          description: Invitation resent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendInvitationResponse"

  /users/{id}/cancel-invite:
    post:
      operationId: cancelInvitation
      tags: [users]
      summary: Cancel a pending invitation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invitation cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /invitations/validate:
    get:
      operationId: validateInvitation
      tags: [users]
      summary: Validate an invitation token (public)
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Token is valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateInvitationResponse"
        "404":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invitations/accept:
    post:
      operationId: acceptInvitation
      tags: [users]
      summary: Accept an invitation and set password (public)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationBody"
      responses:
        "200":
          description: Invitation accepted, account activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Invalid token or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /organizations:
    get:
      operationId: listOrganizations
      tags: [organizations]
      summary: List all organizations
      responses:
        "200":
          description: List of organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganizationSummary"

  # ─── DOMAINS ────────────────────────────────────────────────
  /domains:
    get:
      operationId: listDomains
      tags: [domains]
      summary: List all CMMC security domains with readiness stats
      responses:
        "200":
          description: Domains with readiness
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DomainWithStats"

  /domains/{id}:
    get:
      operationId: getDomain
      tags: [domains]
      summary: Get a domain by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainWithStats"

  # ─── CONTROLS ───────────────────────────────────────────────
  /controls:
    get:
      operationId: listControls
      tags: [controls]
      summary: List CMMC controls with optional filtering
      parameters:
        - name: domain
          in: query
          schema:
            type: string
          description: Filter by domain ID (e.g. AC, IA)
        - name: level
          in: query
          schema:
            type: string
            enum: [L1, L2]
        - name: status
          in: query
          schema:
            type: string
            enum: [not_started, in_progress, implemented, needs_review, assessor_ready, not_applicable, at_risk]
        - name: search
          in: query
          schema:
            type: string
          description: Search by control_id, title, or description
      responses:
        "200":
          description: List of controls
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ControlWithStatus"

  /controls/{id}:
    get:
      operationId: getControl
      tags: [controls]
      summary: Get full control detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Control detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlDetail"
    patch:
      operationId: updateControl
      tags: [controls]
      summary: Update control status and implementation narrative
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateControlBody"
      responses:
        "200":
          description: Updated control
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlWithStatus"

  /controls/{id}/evidence:
    get:
      operationId: getControlEvidence
      tags: [controls]
      summary: Get all evidence linked to a control
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Evidence items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EvidenceItem"

  /controls/{id}/tasks:
    get:
      operationId: getControlTasks
      tags: [controls]
      summary: Get all tasks linked to a control
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"

  /controls/{id}/poams:
    get:
      operationId: getControlPoams
      tags: [controls]
      summary: Get all POA&Ms linked to a control
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: POA&Ms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Poam"

  # ─── EVIDENCE ───────────────────────────────────────────────
  /evidence:
    get:
      operationId: listEvidence
      tags: [evidence]
      summary: List evidence items with filtering
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, needs_classification, pending_review, approved, active, assessor_ready, rejected, stale, superseded, archived]
        - name: evidenceType
          in: query
          schema:
            type: string
        - name: controlId
          in: query
          schema:
            type: string
        - name: domainId
          in: query
          schema:
            type: string
        - name: ownerId
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
          description: Search by title, filename, assessor summary, tags, or control label
        - name: showArchived
          in: query
          schema:
            type: string
          description: Pass "true" to include archived evidence
        - name: expiringDays
          in: query
          schema:
            type: integer
          description: Filter evidence expiring within N days
      responses:
        "200":
          description: Evidence items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EvidenceItem"

  /evidence/upload:
    post:
      operationId: uploadEvidence
      tags: [evidence]
      summary: Upload a new evidence file with metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadEvidenceBody"
      responses:
        "201":
          description: Evidence created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceItem"

  /evidence/search:
    get:
      operationId: searchEvidence
      tags: [evidence]
      summary: Full-text search across evidence title, description, tags
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Matching evidence
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EvidenceItem"

  /evidence/{id}:
    get:
      operationId: getEvidence
      tags: [evidence]
      summary: Get evidence detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Evidence item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceDetail"
    patch:
      operationId: updateEvidence
      tags: [evidence]
      summary: Update evidence metadata
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEvidenceBody"
      responses:
        "200":
          description: Updated evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceItem"

  /evidence/{id}/submit:
    post:
      operationId: submitEvidenceForReview
      tags: [evidence]
      summary: Submit evidence for reviewer approval
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitEvidenceBody"
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceItem"

  /evidence/{id}/approve:
    post:
      operationId: approveEvidence
      tags: [evidence]
      summary: Approve evidence (Reviewer/Compliance Manager only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveEvidenceBody"
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceItem"

  /evidence/{id}/reject:
    post:
      operationId: rejectEvidence
      tags: [evidence]
      summary: Reject evidence with required notes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectEvidenceBody"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceItem"

  /evidence/{id}/mark-stale:
    post:
      operationId: markEvidenceStale
      tags: [evidence]
      summary: Manually mark evidence as stale
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Marked stale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceItem"

  /evidence/{id}/supersede:
    post:
      operationId: supersedeEvidence
      tags: [evidence]
      summary: Supersede old evidence with a new version
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupersedeEvidenceBody"
      responses:
        "201":
          description: New version created, old marked superseded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceItem"

  /evidence/{id}/link-controls:
    post:
      operationId: linkEvidenceToControls
      tags: [evidence]
      summary: Link evidence to one or more CMMC controls
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
